instrument: ach

dataset:
  name: ach
  target_column: is_fraud
  datetime_columns: [settlement_date, effective_date, return_date]
  exclude_columns: [originator_account, receiver_account]  # PII

generation:
  model: dp_ctgan
  n_rows: 500_000
  batch_size: 2048
  epochs: 200
  max_grad_norm: 1.0

privacy:
  epsilon: 3.0
  delta: 1.0e-5
  preset: balanced
  accounting: rdp

evaluation:
  n_shadow_models: 10
  attack_model: lightgbm
  tstr_classifier: xgboost
  ks_pass_rate_target: 0.80
  corr_distance_target: 0.15
  utility_ratio_target: 0.88          # ACH fraud is harder to classify
  mia_auc_target: 0.55
  expected_return_rate_min: 0.010
  expected_return_rate_max: 0.020
  expected_fraud_rate_max: 0.003
