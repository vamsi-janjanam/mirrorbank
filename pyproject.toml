[project]
name = "mirrorbank"
version = "0.1.0"
description = "Differentially private synthetic financial data generator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Data
    "polars>=1.0",
    "pyarrow>=16",
    # Evaluation
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    # UI
    "streamlit>=1.35",
    # Config
    "pyyaml>=6.0",
    # CLI output
    "rich>=13.7",
]

[project.optional-dependencies]
# Install for full DP generation:  pipenv install --categories generate
generate = [
    "torch>=2.3",
    "opacus>=1.5",
    "sdv>=1.14",
]
# Install for release artifacts:  pipenv install --categories release
release = [
    "reportlab>=4.2",
    "jinja2>=3.1",
]
# Install everything:  pipenv install --categories generate release
all = [
    "mirrorbank[generate]",
    "mirrorbank[release]",
    "wandb>=0.17",
]

# Entry point declared but cli.py is not yet implemented (roadmap week 3)
# [project.scripts]
# mirrorbank = "mirrorbank.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirrorbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # line too long — handled by formatter

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
